<body>
    <!-- 1. Placeholders for the top-level objects -->
    <div id="rmn-loader-placeholder"></div>
    <div id="header-placeholder"></div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // A. Load the Loader first to show the user progress
            await LoaderEngine.loadComponent(config_const.COMPONENTS.LOADER);
            
            // B. Load the Header Shell
            await LoaderEngine.loadComponent(config_const.COMPONENTS.HEADER);
            
            // C. Tell the Header Object to assemble its internals
            if (typeof HeaderComponent !== 'undefined') {
                await HeaderComponent.init();
            }

            // D. Hide the loader once everything is visual
            LoaderEngine.hide();
        });
    </script>
</body>
