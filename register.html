<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enskri — Rezo Mapou Nasyonal</title>
  <link rel="icon" type="image/png" href="https://rezomapouglobal.net/favicon.png">
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script src="strings.js"></script>
  <script src="register.js" defer></script>
  <style>
    .register-container { max-width: 550px; margin: 2rem auto; padding: 0 1.5rem; min-height: 80vh; }
    .register-intro { text-align: center; margin-bottom: 1.5rem; }
    
    /* Tighter payment row for full text display */
    .pay-row { display: flex; align-items: center; gap: 6px; border: 1px solid var(--border); border-radius: var(--radius); background: #f9f9f9; }
    .pay-prefix { padding: 0.7rem; background: #eee; font-weight: bold; border-right: 1px solid var(--border); font-size: 0.9rem; }
    .pay-row input { width: 90px; border: none; background: transparent; padding: 0.7rem; outline: none; flex-shrink: 0; }
    .pay-radios { display: none; gap: 8px; font-size: 0.8rem; flex-grow: 1; justify-content: flex-end; padding-right: 8px; }
    .pay-radios.visible { display: flex; }

    .platform-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    footer { text-align: center; padding: 2rem; border-top: 1px solid var(--border); margin-top: 3rem; color: #666; font-size: 0.9rem; }
  </style>
</head>
<body>

<!-- 1. Restored Header -->
<div class="top-bar">
  <div class="top-bar-left"><a href="index.html" data-s="nav_home">Akèy</a></div>
  <div class="lang-bar">
    <button class="lang-btn" onclick="switchLang('ht')">🇭🇹 KR</button>
    <button class="lang-btn" onclick="switchLang('fr')">🇫🇷 FR</button>
    <button class="lang-btn" onclick="switchLang('en')">🇺🇸 EN</button>
  </div>
</div>

<main class="register-container">
  <div class="register-intro">
    <h1 data-s="reg_title">Vin yon Rasin Mapou</h1>
  </div>

  <div class="register-form-card">
    <form id="register-form" novalidate>
      <div class="form-section-title">👤 Idantite</div>
      <div class="form-row">
        <div class="form-group"><label>Prenon*</label><input type="text" name="prenom" required></div>
        <div class="form-group"><label>Siyati*</label><input type="text" name="nom" required></div>
      </div>

      <div class="form-group">
        <label>Imèl*</label>
        <div class="field-wrapper">
          <input type="email" id="email" name="email" required>
          <div id="email-checking" class="field-checking hidden"><div class="loading-spinner"></div></div>
        </div>
        <div id="email-feedback" class="field-feedback"></div>
      </div>

      <div class="form-group">
        <label>Peyi*</label>
        <select id="country" name="country" required></select>
      </div>

      <div class="form-group">
        <label>Nimewo Telefòn*</label>
        <div class="field-wrapper">
          <!-- 3. Dynamic Suffix -->
          <div class="pay-prefix" id="prefix-display">+509</div>
          <input type="tel" id="phone" name="phone" required>
          <div id="phone-checking" class="field-checking hidden"><div class="loading-spinner"></div></div>
        </div>
        <div id="phone-feedback" class="field-feedback"></div>
      </div>

      <div class="form-section-title">💰 Peman</div>
      <div class="pay-row">
        <div class="pay-prefix">+509</div>
        <!-- 2. Shortened field -->
        <input type="text" id="payment_value" name="payment_value" placeholder="8 chif" maxlength="8">
        <div id="pay-selection" class="pay-radios">
          <label><input type="radio" name="payment_type" value="moncash"> MonCash</label>
          <label><input type="radio" name="payment_type" value="natcash"> NatCash</label>
        </div>
      </div>

      <div class="form-section-title">🔗 Rezo Sosyal</div>
      <div class="platform-grid" id="platform-grid"></div>

      <div class="submit-area">
        <button type="submit" class="btn btn-primary btn-full" id="submit-btn" disabled>Anvwaye</button>
      </div>
    </form>
  </div>
</main>

<!-- 1. Restored Footer -->
<footer>
  <p>&copy; 2026 Rezo Mapou Nasyonal - Rezistans ak Pwogrè</p>
</footer>

</body>
</html>
