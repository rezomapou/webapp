<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
    <script src="strings.js"></script>
    <script src="loader.js"></script>
</head>
<body>
    <div id="header-placeholder"></div>

    <main class="container">
        <h1 data-s="reg_title"></h1>
        <form id="register-form">
            <!-- Email Field with Inside Spinner -->
            <div class="form-group">
                <label data-s="f_email"></label>
                <div class="input-container">
                    <input type="email" id="email" name="email" data-s="f_email_ph" required>
                    <div id="email-checking" class="field-spinner hidden"><div class="loading-spinner"></div></div>
                </div>
                <small id="email-msg" class="msg" data-s="f_email_hint"></small>
            </div>

            <!-- Phone Field with Inside Spinner -->
            <div class="form-group">
                <label data-s="f_phone"></label>
                <div class="input-container">
                    <span id="prefix-display">+?</span>
                    <input type="tel" id="phone" name="phone" data-s="f_phone_ph" required>
                    <div id="phone-checking" class="field-spinner hidden"><div class="loading-spinner"></div></div>
                </div>
                <small id="phone-msg" class="msg" data-s="f_phone_hint"></small>
            </div>
<!-- HONEYPOT (Anti-Bot) -->
<div class="hp-container" style="display:none;">
    <input type="text" name="full_name_hp" id="full_name_hp" tabindex="-1" autocomplete="off">
</div>

<!-- PAYMENT SECTION -->
<div class="form-section">
    <div class="form-section-title" data-s="pay_section_title">💰 Peman</div>
    <p class="pay-hint" data-s="pay_hint"></p> <!-- "For when we have to pay you" -->
    
    <div class="pay-row">
        <div class="pay-prefix">+509</div>
        <input type="text" 
               id="payment_value" 
               name="payment_value" 
               data-s="f_payment_ph" 
               maxlength="8" 
               pattern="\d{8}" 
               required>
        
        <div id="pay-selection" class="pay-radios">
            <label>
                <input type="radio" name="payment_type" value="moncash" required> 
                <span data-s="plt_moncash"></span>
            </label>
            <label>
                <input type="radio" name="payment_type" value="natcash"> 
                <span data-s="plt_natcash"></span>
            </label>
        </div>
    </div>
    <small id="pay-msg" class="msg"></small>
</div>
            <button type="submit" id="submit-btn" data-s="f_submit" class="btn-primary" disabled></button>
        </form>
    </main>

    <div id="footer-placeholder"></div>

    <script src="register.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadComponent('header-placeholder', 'HEADER');
            loadComponent('footer-placeholder', 'FOOTER');
        });
    </script>
</body>
</html>
