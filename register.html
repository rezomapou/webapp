<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enskri — Rezo Mapou Nasyonal</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script src="strings.js"></script>
  <style>
    .register-layout{display:grid;grid-template-columns:1fr 420px;gap:2rem;align-items:start;padding:2rem 0 3rem}
    .register-intro{position:sticky;top:calc(var(--topbar-height) + var(--nav-height) + 1rem)}
    .trust-points{list-style:none;display:flex;flex-direction:column;gap:.6rem;padding:0}
    .trust-points li{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--muted)}
    .trust-points li::before{content:'✓';color:var(--forest);font-weight:700}
    .register-form-card{background:white;border:1px solid var(--border);border-radius:var(--radius);padding:1.75rem;box-shadow:var(--shadow)}
    
    .platform-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
    .platform-field{display:flex;align-items:center;gap:6px}
    .platform-field input{flex:1;font-size:.85rem;padding:.5rem .7rem}
    
    .phone-wrapper, .email-wrapper {position:relative}
    .field-checking{position:absolute;right:10px;top:50%;transform:translateY(-50%);z-index:10}
    .loading-spinner {
      width: 16px; height: 16px; border: 2px solid #ccc;
      border-top-color: var(--gold-dark); border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none !important; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    
    @media(max-width:860px){.register-layout{grid-template-columns:1fr}.register-intro{position:static}}
  </style>
</head>
<body>

<div class="top-bar">
  <div class="top-bar-left">
    <a href="index.html" data-s="nav_home">Akèy</a>
    <div class="top-bar-counts"><span><strong id="tb-members">—</strong> <span data-s="dash_members">Rasin Enskri</span></span></div>
  </div>
  <div class="lang-bar">
    <button class="lang-btn" data-lang-btn="ht" onclick="switchLang('ht')">🇭🇹 KR</button>
    <button class="lang-btn" data-lang-btn="fr" onclick="switchLang('fr')">🇫🇷 FR</button>
    <button class="lang-btn" data-lang-btn="en" onclick="switchLang('en')">🇺🇸 EN</button>
  </div>
</div>

<nav class="nav">
  <a href="index.html" class="nav-brand"><span class="nav-name" data-s="site_name">Rezo Mapou Nasyonal</span></a>
  <ul class="nav-links">
    <li><a href="index.html" data-s="nav_home">Akèy</a></li>
    <li><a href="register.html" data-s="nav_register" class="active">Enskri</a></li>
    <li><a href="dashboard.html" data-s="nav_dashboard">Tablodbò</a></li>
  </ul>
</nav>

<main>
  <div class="container">
    <div class="register-layout">
      <div class="register-intro">
        <h1 data-s="reg_title">Vin yon Rasin Mapou</h1>
        <p class="lead" data-s="reg_subtitle">Enskri gratis. Pa gen pèmisyon espesyal.</p>
        <ul class="trust-points" id="trust-points"></ul>
      </div>

      <div class="register-form-card">
        <form id="register-form" novalidate>
          <div class="form-section-title">👤 <span data-s="reg_title">Idantite</span></div>
          <div class="form-row">
            <div class="form-group">
              <label for="prenom"><span data-s="f_firstname">Prenon</span>*</label>
              <input type="text" id="prenom" name="prenom" required>
            </div>
            <div class="form-group">
              <label for="nom"><span data-s="f_lastname">Siyati</span>*</label>
              <input type="text" id="nom" name="nom" required>
            </div>
          </div>

          <!-- Email: Now primary and required -->
          <div class="form-group">
            <label for="email"><span data-s="f_email">Imèl</span>*</label>
            <div class="email-wrapper">
              <input type="email" id="email" name="email" required placeholder="ou@ekzanp.com">
              <div class="field-checking hidden" id="email-checking"><div class="loading-spinner"></div></div>
            </div>
            <div class="field-feedback" id="email-feedback"></div>
          </div>

          <div class="form-group">
            <label for="country"><span data-s="f_country">Peyi</span>*</label>
            <select id="country" name="country" required onchange="onCountryChange(this.value)">
              <option value="">— Chwazi peyi —</option>
            </select>
          </div>

          <!-- Phone: Moved after Country -->
          <div class="form-group">
            <label for="phone"><span data-s="f_phone">Nimewo Telefòn</span>*</label>
            <div class="phone-wrapper">
              <input type="tel" id="phone" name="phone" required placeholder="+509..." inputmode="tel">
              <div class="field-checking hidden" id="phone-checking"><div class="loading-spinner"></div></div>
            </div>
            <div class="field-feedback" id="phone-feedback"></div>
          </div>

          <div class="form-group">
            <label for="langue" data-s="f_lang">Lang prefere</label>
            <select id="langue" name="langue" onchange="lockLang()">
              <option value="ht">🇭🇹 Kreyòl ayisyen</option>
              <option value="fr">🇫🇷 Français</option>
              <option value="en">🇺🇸 English</option>
            </select>
          </div>

          <div class="form-section-title">💰 Peman & Rezo</div>
          <div class="platform-grid">
            <div class="platform-field">
              <span class="platform-icon">💵</span>
              <input type="text" name="moncash" placeholder="MonCash #" pattern="[0-9]*" inputmode="numeric" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
            </div>
            <div class="platform-field">
              <span class="platform-icon">📲</span>
              <input type="text" name="natcash" placeholder="NatCash #" pattern="[0-9]*" inputmode="numeric" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
            </div>
          </div>
          <div class="platform-grid" id="platform-grid" style="margin-top:10px"></div>

          <div class="submit-area">
            <button type="submit" class="btn btn-primary btn-full btn-lg" id="submit-btn" disabled>Enskri kounye a</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="footer-inner">
    <div class="footer-links">
      <a href="terms.html" data-s="legal_terms">Tèm Itilizasyon</a>
      <a href="privacy.html" data-s="legal_privacy">Konfidansyalite</a>
    </div>
    <div class="footer-copy" data-s="legal_rights">© 2026 Rezo Mapou Nasyonal</div>
  </div>
</footer>

<script>
let _validity = { phone: false, email: false };
let isLangManual = false;

document.addEventListener('DOMContentLoaded', () => {
  const lang = getCurrentLang();
  L(lang, 'register');
  document.getElementById('langue').value = lang;
  populateCountries();
  populatePlatforms();
  renderTrustPoints(lang);
  document.getElementById('register-form').addEventListener('input', validateFormState);
});

function lockLang() { isLangManual = true; }

function switchLang(l) { 
  L(l, 'register'); 
  renderTrustPoints(l); 
  if (!isLangManual) document.getElementById('langue').value = l; 
}

function validateFormState() {
  const f = document.getElementById('register-form');
  const btn = document.getElementById('submit-btn');
  const hasReq = f.prenom.value.trim() && f.nom.value.trim() && f.email.value.trim() && f.country.value && f.phone.value.trim();
  btn.disabled = !(hasReq && _validity.phone && _validity.email);
}

['phone', 'email'].forEach(id => {
  document.getElementById(id).addEventListener('blur', function() {
    if (this.value.trim()) checkAvailability(id, this.value.trim());
  });
});

async function checkAvailability(type, raw) {
  const checking = document.getElementById(`${type}-checking`);
  checking.classList.remove('hidden');
  
  let val = raw;
  if (type === 'phone') {
    val = raw.replace(/\D/g, '');
    if (val.startsWith('509')) val = val.substring(3);
  }

  try {
    const params = new URLSearchParams({ action:'check_availability', type, value: val, lang: getCurrentLang() });
    const res = await fetch(`${RMN_CONFIG.SCRIPT_URL}?${params}`);
    const d = await res.json();
    checking.classList.add('hidden');
    
    if (d.exists) {
      setFeedback(type, 'error', s(`f_${type}_exists`));
      _validity[type] = false;
    } else {
      setFeedback(type, 'ok', 'OK');
      _validity[type] = true;
      if (type === 'phone') document.getElementById('phone').dataset.normalized = d.normalized || val;
    }
  } catch(e) { checking.classList.add('hidden'); _validity[type] = false; }
  validateFormState();
}

function populatePlatforms() {
  const grid = document.getElementById('platform-grid');
  RMN_CONFIG.PLATFORMS.filter(p => !['MonCash','NatCash'].includes(p.key)).forEach(p => {
    const div = document.createElement('div');
    div.className = 'platform-field';
    div.innerHTML = `<span class="platform-icon">${p.icon}</span><input type="url" name="${p.key.toLowerCase()}" placeholder="${p.key}">`;
    grid.appendChild(div);
  });
}

function renderTrustPoints(lang) {
  const pts = {
    ht:['Gratis pou tout moun','Pa gen pèmisyon espesyal','Nimewo ou pwoteje'],
    fr:['Gratuit pour tous','Aucune autorisation requise','Votre numéro est protégé'],
    en:['Free for everyone','No special permission needed','Your number is protected'],
  };
  document.getElementById('trust-points').innerHTML = (pts[lang]||pts.ht).map(p=>`<li>${p}</li>`).join('');
}

function setFeedback(id, cls, msg) {
  const fb = document.getElementById(`${id}-feedback`);
  fb.className = 'field-feedback ' + cls;
  fb.textContent = msg;
}

document.getElementById('register-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = "...";

  const params = new URLSearchParams(new FormData(this));
  params.set('action', 'register');
  const normPhone = document.getElementById('phone').dataset.normalized;
  if (normPhone) params.set('phone', normPhone);
  params.set('langue', document.getElementById('langue').value);

  await fetch(RMN_CONFIG.SCRIPT_URL, { method: 'POST', body: params, mode: 'no-cors' });
  alert("Enskripsyon fèt!");
  window.location.href = "dashboard.html";
});

function populateCountries() {
  const sel = document.getElementById('country');
  DIASPORA_COUNTRIES.forEach(c => {
    const o = document.createElement('option');
    o.value = c; o.textContent = c; sel.appendChild(o);
  });
}
</script>
</body>
</html>
