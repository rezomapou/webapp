<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enskri — Rezo Mapou Nasyonal</title>
  <link rel="icon" type="image/png" href="https://rezomapouglobal.net/favicon.png">
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script src="strings.js"></script>
  <style>
    /* Visual structure for the registration layout */
    .register-layout { display: grid; grid-template-columns: 1fr 420px; gap: 2rem; align-items: start; padding: 2rem 0; }
    .location-group { display: none; margin-top: 1rem; }
    .location-group.visible { display: block; }
    
    /* Phone input with flag/prefix */
    .phone-box { display: flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: white; }
    .prefix-label { background: #f0f0f0; padding: 0.7rem; border-right: 1px solid var(--border); font-weight: 500; min-width: 65px; text-align: center; }
    .phone-box input { border: none !important; flex: 1; padding: 0.7rem; }
    
    .hidden { display: none !important; }
    @media(max-width: 860px) { .register-layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<main class="container">
  <div class="register-layout">
    <div class="register-intro">
      <h1 data-s="reg_title">Vin yon Rasin Mapou</h1>
      <ul class="trust-points" id="trust-points"></ul>
    </div>

    <div class="register-form-card">
      <form id="register-form" novalidate>
        <div class="form-section-title">👤 Idantite</div>
        <div class="form-row">
          <div class="form-group"><label>Prenon*</label><input type="text" name="prenom" required></div>
          <div class="form-group"><label>Siyati*</label><input type="text" name="nom" required></div>
        </div>

        <div class="form-group">
          <label>Imèl*</label>
          <div class="email-wrapper" style="position:relative;">
            <input type="email" id="email" name="email" required placeholder="rara@azor.com">
            <div id="email-checking" class="field-checking hidden"><div class="loading-spinner"></div></div>
          </div>
          <div id="email-feedback" class="field-feedback"></div>
        </div>

        <div class="form-group">
          <label>Peyi*</label>
          <select id="country" name="country" required onchange="onCountryChange(this.value)">
            <option value="">— Chwazi peyi —</option>
          </select>
        </div>

        <!-- 2. Territory Population (Haiti vs Diaspora) -->
        <div id="location-haiti" class="location-group">
          <div class="form-group">
            <label>Depatman*</label>
            <select id="departement" name="departement" onchange="onDeptChange(this.value)"></select>
          </div>
          <div class="form-group">
            <label>Komin*</label>
            <select id="commune" name="commune"></select>
          </div>
        </div>

        <div id="location-diaspora" class="location-group">
          <div class="form-group">
            <label>Vil*</label>
            <input type="text" id="city" name="city" placeholder="Ex: Miami, Paris">
          </div>
        </div>

        <div class="form-group">
          <label>Nimewo Telefòn*</label>
          <div class="phone-box">
            <div class="prefix-label" id="prefix-display">+?</div>
            <input type="tel" id="phone" name="phone" required placeholder="0000 0000">
          </div>
          <div id="phone-feedback" class="field-feedback"></div>
        </div>

        <div class="form-group">
          <label>Lang prefere</label>
          <select id="langue" name="langue" onchange="isLangManual=true">
            <option value="ht">🇭🇹 Kreyòl ayisyen</option>
            <option value="fr">🇫🇷 Français</option>
          </select>
        </div>

        <!-- 3 & 4. Payment Fields with Numeric Only[cite: 1] -->
        <div class="form-section-title">💰 Peman (8 chif)</div>
        <div class="platform-grid">
          <div class="form-group">
            <label>MonCash</label>
            <input type="text" name="moncash" placeholder="3XXX XXXX" maxlength="11" oninput="this.value=this.value.replace(/\D/g,'')">
          </div>
          <div class="form-group">
            <label>NatCash</label>
            <input type="text" name="natcash" placeholder="4XXX XXXX" maxlength="11" oninput="this.value=this.value.replace(/\D/g,'')">
          </div>
        </div>

        <div class="submit-area">
          <button type="submit" class="btn btn-primary btn-full" id="submit-btn" disabled>Enskri</button>
        </div>
      </form>
    </div>
  </div>
</main>

<script>
let _validity = { phone: false, email: false };
let isLangManual = false;

// 6. Prefixes from image_a32c6d.jpg context[cite: 1]
const PREFIX_MAP = { 'Haïti': '+509', 'USA': '+1', 'Canada': '+1', 'France': '+33', 'Dominican Republic': '+1' };

document.addEventListener('DOMContentLoaded', () => {
  populateCountries();
  populateDepts();
  document.getElementById('register-form').addEventListener('input', validateFormState);
});

function populateCountries() {
  const sel = document.getElementById('country');
  while (sel.options.length > 1) sel.remove(1);
  DIASPORA_COUNTRIES.forEach(c => {
    const o = document.createElement('option');
    o.value = c; o.textContent = c;
    sel.appendChild(o);
  });
}

function populateDepts() {
  const sel = document.getElementById('departement');
  sel.innerHTML = '<option value="">— Chwazi depatman —</option>';
  Object.keys(HAITI).sort().forEach(d => {
    const o = document.createElement('option');
    o.value = d; o.textContent = d;
    sel.appendChild(o);
  });
}

function onCountryChange(value) {
  const isHaiti = value === 'Haïti';
  const hasValue = value !== '';
  
  // Toggle UI visibility[cite: 1]
  document.getElementById('location-haiti').classList.toggle('visible', isHaiti);
  document.getElementById('location-diaspora').classList.toggle('visible', !isHaiti && hasValue);
  
  // Set requirements[cite: 1]
  document.getElementById('departement').required = isHaiti;
  document.getElementById('commune').required = isHaiti;
  document.getElementById('city').required = !isHaiti && hasValue;
  
  // Update Prefix[cite: 1]
  document.getElementById('prefix-display').textContent = PREFIX_MAP[value] || '+?';
  
  validateFormState();
}

function onDeptChange(dept) {
  const sel = document.getElementById('commune');
  sel.innerHTML = `<option value="">— Chwazi komin —</option>`;
  if (!dept || !HAITI[dept]) { sel.disabled = true; return; }
  HAITI[dept].sort().forEach(c => {
    const o = document.createElement('option');
    o.value = c; o.textContent = c;
    sel.appendChild(o);
  });
  sel.disabled = false;
}

function validateFormState() {
  const f = document.getElementById('register-form');
  const btn = document.getElementById('submit-btn');
  const hasRequired = f.prenom.value && f.nom.value && f.email.value.includes('@') && f.country.value && f.phone.value;
  btn.disabled = !(hasRequired && _validity.phone && _validity.email);
}

// Backend check logic remains same[cite: 1]
document.getElementById('email').addEventListener('blur', function() {
  if (this.value.includes('@')) checkAvailability('email', this.value);
});

async function checkAvailability(type, raw) {
  const checking = document.getElementById(`${type}-checking`);
  checking.classList.remove('hidden');
  
  let val = raw;
  if (type === 'phone') {
    val = raw.replace(/\D/g, '');
    if (val.startsWith('509')) val = val.substring(3);
  }

  try {
    const params = new URLSearchParams({ action:'check_availability', type, value: val, lang: getCurrentLang() });
    const res = await fetch(`${RMN_CONFIG.SCRIPT_URL}?${params}`);
    const d = await res.json();
    checking.classList.add('hidden');
    
    if (d.exists) {
      setFeedback(type, 'error', s(`f_${type}_exists`));
      _validity[type] = false;
    } else {
      setFeedback(type, 'ok', 'OK');
      _validity[type] = true;
      if (type === 'phone') document.getElementById('phone').dataset.normalized = d.normalized || val;
    }
  } catch(e) { checking.classList.add('hidden'); _validity[type] = false; }
  validateFormState();
}


</script>
</body>
</html>
