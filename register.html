<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enskri — Rezo Mapou Nasyonal</title>
  <link rel="icon" type="image/png" href="https://rezomapouglobal.net/favicon.png">
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script src="strings.js"></script>
  <!-- 4. Logic moved to external file[cite: 1] -->
  <script src="register.js" defer></script>
  <style>
    .register-container { max-width: 550px; margin: 2rem auto; padding: 0 1rem; }
    .register-intro { text-align: center; margin-bottom: 1.5rem; }
    
    .field-wrapper { position: relative; display: flex; align-items: center; border: 1px solid var(--border); border-radius: var(--radius); background: white; }
    .field-wrapper input { border: none !important; flex: 1; padding: 0.7rem; outline: none; }
    
    /* 2. Payment Row Styling[cite: 1] */
    .pay-row { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); border-radius: var(--radius); background: #f9f9f9; padding-right: 10px; }
    .pay-prefix { padding: 0.7rem; background: #eee; font-weight: bold; border-right: 1px solid var(--border); }
    .pay-radios { display: none; gap: 10px; font-size: 0.85rem; }
    .pay-radios.visible { display: flex; }

    /* 1. Platforms side-by-side[cite: 1] */
    .platform-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    
    .field-feedback { font-size: 0.75rem; margin-top: 4px; min-height: 1.2em; }
    .field-feedback.ok { color: var(--forest); }
    .field-feedback.error { color: #d93025; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<main class="register-container">
  <div class="register-intro">
    <h1 data-s="reg_title">Vin yon Rasin Mapou</h1>
  </div>

  <div class="register-form-card">
    <form id="register-form" novalidate>
      <div class="form-section-title">👤 Idantite</div>
      <div class="form-row">
        <div class="form-group"><label>Prenon*</label><input type="text" name="prenom" required></div>
        <div class="form-group"><label>Siyati*</label><input type="text" name="nom" required></div>
      </div>

      <div class="form-group">
        <label>Imèl*</label>
        <div class="field-wrapper">
          <input type="email" id="email" name="email" required>
          <div id="email-checking" class="field-checking hidden"><div class="loading-spinner"></div></div>
        </div>
        <div id="email-feedback" class="field-feedback"></div>
      </div>

      <div class="form-group">
        <label>Peyi*</label>
        <select id="country" name="country" required onchange="onCountryChange(this.value)">
          <option value="">— Chwazi peyi —</option>
        </select>
      </div>

      <div class="form-group">
        <label>Nimewo Telefòn*</label>
        <div class="field-wrapper">
          <div class="pay-prefix" id="prefix-display">+509</div>
          <input type="tel" id="phone" name="phone" required placeholder="8 chif">
          <div id="phone-checking" class="field-checking hidden"><div class="loading-spinner"></div></div>
        </div>
        <div id="phone-feedback" class="field-feedback"></div>
      </div>

      <!-- 3. Payment logic: Radios on the right[cite: 1] -->
      <div class="form-section-title">💰 Peman</div>
      <div class="pay-row">
        <div class="pay-prefix">+509</div>
        <input type="text" id="payment_value" name="payment_value" placeholder="Nimewo" maxlength="8">
        <div id="pay-selection" class="pay-radios">
          <label><input type="radio" name="payment_type" value="moncash"> Mon</label>
          <label><input type="radio" name="payment_type" value="natcash"> Nat</label>
        </div>
      </div>
      <div id="pay-feedback" class="field-feedback"></div>

      <!-- 1. Two-column platforms[cite: 1] -->
      <div class="form-section-title">🔗 Rezo Sosyal</div>
      <div class="platform-grid" id="platform-grid"></div>

      <div class="submit-area">
        <button type="submit" class="btn btn-primary btn-full" id="submit-btn" disabled>Enskri</button>
      </div>
    </form>
  </div>
</main>
</body>
</html>
