<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lyen — Rezo Mapou Nasyonal</title>
  <meta name="description" content="Jwenn lyen yon manm Rezo Mapou.">
  <meta property="og:title" content="Lyen Manm Rezo Mapou">
  <meta property="og:image" content="https://rezomapou.github.io/webapp/og_image.png">
  <meta property="og:type" content="profile">
  <meta name="twitter:card" content="summary">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script src="strings.js"></script>
  <style>
    body { background: var(--cream-dark); }
    .links-wrap {
      max-width: 420px;
      margin: 0 auto;
      padding: 1.5rem 1rem 3rem;
    }
    .links-back {
      font-size: 0.8rem;
      color: var(--muted);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 1.25rem;
    }
    .links-back:hover { color: var(--forest); text-decoration: none; }
    .links-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .links-card-header {
      background: var(--forest);
      padding: 1.75rem 1.5rem 1.5rem;
      text-align: center;
    }
    .links-avatar-wrap {
      width: 72px;
      height: 72px;
      margin: 0 auto 0.75rem;
    }
    .links-avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255,255,255,0.3);
      display: block;
    }
    .links-avatar-fallback {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--gold);
      color: var(--earth);
      font-family: var(--font-serif);
      font-size: 1.6rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .links-name {
      font-family: var(--font-serif);
      font-size: 1.2rem;
      font-weight: 900;
      color: white;
      margin-bottom: 4px;
    }
    .links-location {
      font-size: 0.8rem;
      color: var(--on-dark-muted);
      margin-bottom: 6px;
    }
    .links-card-body { padding: 1.25rem; }
    .link-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--cream);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s, transform 0.1s;
      margin-bottom: 0.5rem;
    }
    .link-btn:hover {
      background: var(--cream-dark);
      color: var(--ink);
      text-decoration: none;
      transform: translateY(-1px);
    }
    .link-btn-icon { font-size: 1.2rem; width: 28px; text-align: center; flex-shrink: 0; }
    .link-btn-label { flex: 1; }
    .contact-btn {
      background: var(--forest);
      color: white;
      border-color: var(--forest);
      margin-top: 0.75rem;
    }
    .contact-btn:hover { background: var(--forest-light); color: white; border-color: var(--forest-light); }
    .contact-btn-pending {
      background: var(--cream-dark);
      color: var(--muted);
      border-color: var(--border);
      cursor: default;
    }
    .contact-btn-pending:hover { transform: none; background: var(--cream-dark); }
    .contact-btn-connected {
      background: var(--info-bg);
      color: var(--info);
      border-color: var(--info);
    }
    .join-strip {
      background: var(--forest-pale);
      border: 1px solid rgba(30,77,43,0.15);
      border-radius: var(--radius-sm);
      padding: 0.85rem 1rem;
      text-align: center;
      margin-top: 0.75rem;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .join-strip a { color: var(--forest); font-weight: 600; }
    .loading-block { text-align: center; padding: 3rem 1rem; }
    .error-block {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--muted);
      font-size: 0.88rem;
    }
    .rmn-brand {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .rmn-brand a { color: var(--forest); font-weight: 600; text-decoration: none; }
    .rmn-brand a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<!-- TOP BAR -->
<div class="top-bar">
  <div class="top-bar-left">
    <a href="index.html" data-s="nav_home">Akèy</a>
  </div>
  <div class="lang-bar">
    <button class="lang-btn active" data-lang-btn="ht" onclick="switchLang('ht')">🇭🇹 KR</button>
    <button class="lang-btn" data-lang-btn="fr" onclick="switchLang('fr')">🇫🇷 FR</button>
    <button class="lang-btn" data-lang-btn="en" onclick="switchLang('en')">🇺🇸 EN</button>
  </div>
</div>

<!-- MAIN -->
<main>
  <div class="links-wrap">
    <a href="index.html" class="links-back" data-s="btn_back">← Akèy</a>

    <!-- LOADING -->
    <div id="state-loading" class="loading-block">
      <div class="loading-spinner" style="margin:0 auto 1rem;"></div>
      <span data-s="btn_loading">Ap chaje...</span>
    </div>

    <!-- PROFILE CARD -->
    <div id="state-content" class="hidden">
      <div class="links-card">
        <div class="links-card-header">
          <div class="links-avatar-wrap">
            <img id="profile-avatar" class="links-avatar" src="" alt=""
              onerror="this.style.display='none';document.getElementById('avatar-fallback').style.display='flex';">
            <div id="avatar-fallback" class="links-avatar-fallback" style="display:none;" id="avatar-init">?</div>
          </div>
          <div class="links-name" id="profile-name">—</div>
          <div class="links-location" id="profile-location"></div>
          <div id="profile-badge"></div>
        </div>

        <div class="links-card-body">
          <!-- LINKS LIST -->
          <div id="links-list"></div>

          <!-- CONTACT BUTTON -->
          <div id="contact-area"></div>

          <!-- JOIN STRIP for non-members -->
          <div id="join-strip" class="join-strip hidden">
            <span id="join-msg">Konekte pou kontakte manm sa a.</span>
            &nbsp;
            <a href="register.html" data-s="links_register">Enskri</a>
            &nbsp;·&nbsp;
            <a href="login.html" data-s="nav_login">Konekte</a>
          </div>
        </div>
      </div>

      <!-- RMN BRAND -->
      <div class="rmn-brand">
        <span id="brand-msg">Yon manm</span>
        <a href="index.html" data-s="site_name">Rezo Mapou Nasyonal</a>
      </div>
    </div>

    <!-- ERROR -->
    <div id="state-error" class="error-block hidden">
      <p id="error-msg">Manm pa jwenn.</p>
      <a href="index.html" class="btn btn-outline btn-sm mt-2" data-s="nav_home">Akèy</a>
    </div>
  </div>
</main>

<script>
document.addEventListener('DOMContentLoaded', () => {
  L(getCurrentLang(), 'links');
  loadMemberLinks();
});

function switchLang(lang) { L(lang, 'links'); }

async function loadMemberLinks() {
  const params  = new URLSearchParams(window.location.search);
  const memberId = params.get('id') || '';

  if (!memberId) {
    showError('Idantifyan manm manke.');
    return;
  }

  try {
    // Fetch profile
    const profileRes = await fetch(`${RMN_CONFIG.SCRIPT_URL}?action=member&id=${encodeURIComponent(memberId)}`);
    const profileData = await profileRes.json();

    if (!profileData.success) {
      showError(s('not_found') || 'Manm pa jwenn.');
      return;
    }

    // Fetch links
    const linksRes = await fetch(`${RMN_CONFIG.SCRIPT_URL}?action=links&id=${encodeURIComponent(memberId)}`);
    const linksData = await linksRes.json();

    renderProfile(profileData.profile, linksData.links || []);

  } catch(e) {
    showError(s('f_error') || 'Erè koneksyon.');
  }
}

function renderProfile(profile, links) {
  const lang = getCurrentLang();

  // Avatar
  const initials = ((profile.first_name||'?')[0] + (profile.last_name||'?')[0]).toUpperCase();
  document.getElementById('avatar-init').textContent = initials;
  // No avatar URL stored yet — show fallback
  document.getElementById('profile-avatar').style.display = 'none';
  document.getElementById('avatar-fallback').style.display = 'flex';

  // Name
  document.getElementById('profile-name').textContent =
    `${profile.first_name || ''} ${profile.last_name || ''}`.trim();

  // Location
  const loc = profile.commune_nom
    ? `${profile.commune_nom}, ${profile.dept_nom}`
    : profile.city
    ? `${profile.city}${profile.state ? ', ' + profile.state : ''}`
    : profile.country || '';
  document.getElementById('profile-location').textContent = loc;

  // Trust badge
  const levelKeys = ['level_0','level_1','level_2'];
  const levelClasses = ['badge-level-0','badge-level-1','badge-level-2'];
  const lvl = parseInt(profile.trust_level) || 0;
  document.getElementById('profile-badge').innerHTML =
    `<span class="badge ${levelClasses[lvl] || 'badge-level-0'}">${s(levelKeys[lvl] || 'level_0')}</span>`;

  // Update OG tags dynamically
  document.title = `${profile.first_name} — ${s('site_name')}`;
  document.querySelector('meta[property="og:title"]')?.setAttribute('content', `${profile.first_name} — Rezo Mapou`);

  // Links
  const listEl = document.getElementById('links-list');
  if (links.length === 0) {
    listEl.innerHTML = `<p class="text-muted text-sm" style="text-align:center;padding:1rem 0;">${s('dash_no_data')}</p>`;
  } else {
    listEl.innerHTML = links.map(lnk => {
      const platform = RMN_CONFIG.PLATFORMS.find(p => p.key === lnk.platform) || { icon:'🔗', key:'OTHER' };
      const label = lnk.label || platformLabel(lnk.platform) || lnk.platform;
      return `
        <a href="${escapeHtml(lnk.url)}" target="_blank" rel="noopener noreferrer" class="link-btn">
          <span class="link-btn-icon">${platform.icon}</span>
          <span class="link-btn-label">${escapeHtml(label)}</span>
          <span style="color:var(--muted);font-size:.8rem;">↗</span>
        </a>
      `;
    }).join('');
  }

  // Contact button — check session
  renderContactButton(profile.member_id, lang);

  // Brand message
  const brandMsgs = {
    ht: 'Yon manm ',
    fr: 'Un membre de ',
    en: 'A member of ',
  };
  document.getElementById('brand-msg').textContent = brandMsgs[lang] || brandMsgs.ht;

  // Show content
  document.getElementById('state-loading').classList.add('hidden');
  document.getElementById('state-content').classList.remove('hidden');
}

async function renderContactButton(targetId, lang) {
  const session   = localStorage.getItem(RMN_CONFIG.LOCALSTORAGE_TOKEN_KEY);
  const myId      = localStorage.getItem(RMN_CONFIG.LOCALSTORAGE_ID_KEY);
  const contactArea = document.getElementById('contact-area');
  const joinStrip   = document.getElementById('join-strip');

  // Same member viewing their own links page
  if (myId && myId === targetId) {
    contactArea.innerHTML = `
      <a href="profile.html" class="link-btn contact-btn">
        <span class="link-btn-icon">✏️</span>
        <span class="link-btn-label" data-s="vitrine_edit">${s('vitrine_edit')}</span>
      </a>
    `;
    return;
  }

  // Not logged in
  if (!session) {
    joinStrip.classList.remove('hidden');
    const msgs = {
      ht:'Konekte pou kontakte manm sa a.',
      fr:'Connectez-vous pour contacter ce membre.',
      en:'Log in to contact this member.',
    };
    document.getElementById('join-msg').textContent = msgs[lang] || msgs.ht;
    return;
  }

  // Logged in — show contact button
  contactArea.innerHTML = `
    <button class="link-btn contact-btn" onclick="sendConnectionRequest('${targetId}')">
      <span class="link-btn-icon">🤝</span>
      <span class="link-btn-label" id="contact-btn-label" data-s="links_contact">${s('links_contact')}</span>
    </button>
  `;
}

async function sendConnectionRequest(targetId) {
  const session = localStorage.getItem(RMN_CONFIG.LOCALSTORAGE_TOKEN_KEY);
  if (!session) { window.location.href = 'login.html'; return; }

  const btn = document.querySelector('.contact-btn');
  const lbl = document.getElementById('contact-btn-label');
  if (btn) { btn.disabled = true; if(lbl) lbl.textContent = s('links_pending'); }

  try {
    const params = new URLSearchParams({
      action:       'coach_request',
      token:        session,
      recipient_id: targetId,
      request_type: 'CONNECTION',
    });
    await fetch(RMN_CONFIG.SCRIPT_URL, { method:'POST', body:params, mode:'no-cors' });
    if (lbl) lbl.textContent = s('links_pending') || 'Annatant...';
    if (btn) btn.className = 'link-btn contact-btn-pending';
  } catch(e) {
    if (btn) btn.disabled = false;
    if (lbl) lbl.textContent = s('links_contact');
  }
}

function showError(msg) {
  document.getElementById('state-loading').classList.add('hidden');
  document.getElementById('state-error').classList.remove('hidden');
  document.getElementById('error-msg').textContent = msg;
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
