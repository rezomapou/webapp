<div class="features-tabs">
    <div class="feat-hero">
        <div class="feat-hero-tag" data-i="hero_tag"></div>
        <h1 class="feat-hero-title">
            <span data-i="hero_h1a"></span>
            <em data-i="hero_h1b"></em>
            <span class="feat-accent" data-i="hero_h1c"></span>
        </h1>
        <p class="feat-hero-lead" data-i="hero_lead"></p>
        <div class="feat-hero-btns">
            <a href="#register" class="feat-btn-gold" data-i="hero_cta1"></a>
            <a href="#program" class="feat-btn-outline" data-i="hero_cta2"></a>
        </div>
    </div>

    <div class="features-tab-bar">
        <button class="ftab active" data-tab="filozofi" data-i="tab_filozofi">Filozofi</button>
        <button class="ftab" data-tab="program" data-i="tab_program">Pwogram</button>
    </div>

    <div class="ftab-content active" id="ftab-filozofi">
        <div class="feat-section">
            <div class="feat-eyebrow" data-i="map_eye"></div>
            <h2 class="feat-title" data-i="map_title"></h2>
            <p class="feat-body" data-i="map_p1"></p>
            <p class="feat-body" data-i="map_p2"></p>
            <div class="feat-disclaimer">
                <p><strong data-i="map_dis_title"></strong></p>
                <p data-i="map_dis1"></p>
                <p data-i="map_dis2"></p>
                <p data-i="map_dis3"></p>
            </div>
        </div>
    </div>

    <div class="ftab-content" id="ftab-program">
        <div class="feat-section">
            <div class="feat-callout" data-i="ven_call"></div>
            <div class="feat-eyebrow" data-i="prog_eye"></div>
            <h2 class="feat-title" data-i="prog_title"></h2>
            <div class="feat-steps">
                <div class="feat-step">
                    <span class="feat-step-num">1</span>
                    <div class="feat-step-title" data-i="st1t"></div>
                    <div class="feat-step-desc" data-i="st1d"></div>
                </div>
                <div class="feat-step">
                    <span class="feat-step-num">2</span>
                    <div class="feat-step-title" data-i="st2t"></div>
                    <div class="feat-step-desc" data-i="st2d"></div>

                <div class="feat-step">
                    <span class="feat-step-num">3</span>
                    <div class="feat-step-title" data-i="st3t"></div>
                    <div class="feat-step-desc" data-i="st3d"></div>
                </div>
            </div>
            <div class="feat-conditions">
                <div class="feat-cond">
                    <div class="feat-cond-title" data-i="c1t"></div>
                    <div class="feat-cond-desc" data-i="c1d"></div>
                </div>
                <div class="feat-cond">
                    <div class="feat-cond-title" data-i="c2t"></div>
                    <div class="feat-cond-desc" data-i="c2d"></div>
                </div>
                <div class="feat-cond">
                    <div class="feat-cond-title" data-i="c3t"></div>
                    <div class="feat-cond-desc" data-i="c3d"></div>
                </div>
            </div>
        </div>
    </div>
</div>
