<div class="register-wrap container-narrow page-content">
    <div class="eyebrow" data-i="nav_register"></div>
    <h1 data-i="reg_title"></h1>
    <p class="register-lead" data-i="reg_subtitle"></p>

    <div class="card mt-2">
        <form id="register-form" novalidate>

            <div style="position:absolute;left:-9999px;"><input type="text" name="hp_name" tabindex="-1" autocomplete="off"></div>

            <!-- Identity -->
            <div class="fsec" data-i="f_sect_identity"></div>
            <div class="form-row">
                <div class="form-group">
                    <label data-i="f_firstname"></label>
                    <input type="text" name="prenom" id="reg-prenom" required>
                </div>
                <div class="form-group">
                    <label data-i="f_lastname"></label>
                    <input type="text" name="nom" id="reg-nom" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label data-i="reg_gender"></label>
                    <select name="genre" id="reg-genre">
                        <option value="">—</option>
                        <option value="F" data-i="gender_f"></option>
                        <option value="M" data-i="gender_m"></option>
                        <option value="X" data-i="gender_x"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label data-i="f_lang"></label>
                    <select name="langue" id="reg-lang">
                        <option value="ht">Kreyòl</option>
                        <option value="fr">Français</option>
                        <option value="en">English</option>
                    </select>
                </div>
            </div>

            <!-- Email with spinner -->
            <div class="form-group">
                <label data-i="f_email"></label>
                <div class="input-container">
                    <input type="email" name="email" id="reg-email" required autocomplete="email">
                    <div class="field-spinner hidden" id="email-spinner">
                        <div class="loading-spinner"></div>
                    </div>
                </div>
                <div class="field-feedback" id="email-feedback"></div>
            </div>

            <!-- Phone with spinner -->
            <div class="form-group">
                <label data-i="f_phone"></label>
                <div class="input-container">
                    <span id="phone-prefix" class="input-prefix">+509</span>
                    <input type="tel" name="phone" id="reg-phone" required autocomplete="tel">
                    <div class="field-spinner hidden" id="phone-spinner">
                        <div class="loading-spinner"></div>
                    </div>
                </div>
                <div class="field-feedback" id="phone-feedback"></div>
            </div>

            <!-- Location -->
            <div class="fsec" data-i="f_sect_location"></div>
            <div class="form-group">
                <label data-i="f_country"></label>
                <select name="country" id="reg-country" required></select>
            </div>
            <div id="haiti-fields" style="display:none;">
                <div class="form-row">
                    <div class="form-group">
                        <label data-i="f_dept"></label>
                        <select name="departement" id="reg-dept"><option value="">—</option></select>
                    </div>
                    <div class="form-group">
                        <label data-i="f_commune"></label>
                        <select name="commune" id="reg-commune"><option value="">—</option></select>
                    </div>
                </div>
            </div>
            <div id="diaspora-fields" style="display:none;">
                <div class="form-row">
                    <div class="form-group">
                        <label data-i="f_city"></label>
                        <input type="text" name="city" id="reg-city">
                    </div>
                    <div class="form-group">
                        <label data-i="f_state"></label>
                        <input type="text" name="state" id="reg-state">
                    </div>
                </div>
            </div>

            <!-- Payment -->
            <div class="fsec" data-i="f_sect_payment"></div>
            <div class="form-group">
                <small class="hint" data-i="f_payment_hint"></small>
                <div style="display:flex;gap:1.5rem;margin:0.5rem 0;">
                    <label style="display:flex;align-items:center;gap:6px;font-size:0.88rem;cursor:pointer;">
                        <input type="radio" name="payment_type" value="moncash">
                        <span data-i="pay_moncash"></span>
                    </label>
                    <label style="display:flex;align-items:center;gap:6px;font-size:0.88rem;cursor:pointer;">
                        <input type="radio" name="payment_type" value="natcash">
                        <span data-i="pay_natcash"></span>
                    </label>
                </div>
                <input type="text" name="payment_number" id="reg-payment" maxlength="8" style="max-width:180px;">
            </div>

            <!-- Social -->
            <div class="fsec" data-i="f_sect_social"></div>
            <div class="form-row">
                <div class="form-group">
                    <label>WhatsApp</label>
                    <div class="input-container">
                        <span class="input-prefix" id="wa-prefix">+509</span>
                        <input type="tel" name="whatsapp" id="reg-whatsapp">
                        <div class="field-spinner hidden" id="whatsapp-spinner">
                            <div class="loading-spinner"></div>
                        </div>
                    </div>
                    <div class="field-feedback" id="whatsapp-feedback"></div>
                </div>
                <div class="form-group">
                    <label>Facebook</label>
                    <input type="url" name="facebook" placeholder="facebook.com/...">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Instagram</label>
                    <input type="url" name="instagram" placeholder="instagram.com/...">
                </div>
                <div class="form-group">
                    <label>TikTok</label>
                    <input type="url" name="tiktok" placeholder="tiktok.com/@...">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>YouTube</label>
                    <input type="url" name="youtube" placeholder="youtube.com/...">
                </div>
                <div class="form-group">
                    <label data-i="f_website">Site web</label>
                    <input type="url" name="website" placeholder="https://...">
                </div>
            </div>

            <!-- Terms -->
            <div class="form-group mt-2">
                <div class="fcheck">
                    <input type="checkbox" id="reg-terms" required>
                    <label for="reg-terms" data-i="f_terms_consent"></label>
                </div>
            </div>

            <div class="alert hidden" id="reg-error"></div>

            <button type="submit" class="btn btn-gold btn-full btn-lg mt-2" id="reg-submit" disabled>
                <span data-i="f_submit"></span>
            </button>
        </form>

        <!-- Success shown after form hides -->
        <div class="hidden" id="reg-success-block" style="text-align:center;padding:2.5rem 1rem;">
            <div style="font-size:3rem;margin-bottom:1rem;">🌱</div>
            <h2 style="font-family:var(--font-serif);margin-bottom:0.5rem;" data-i="f_success_title">Mèsi!</h2>
            <p data-i="f_success"></p>
        </div>
    </div>
</div>
